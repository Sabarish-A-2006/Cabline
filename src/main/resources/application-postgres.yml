spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cab_booking}
    username: ${DATABASE_USERNAME:cab_user}
    password: ${DATABASE_PASSWORD:cab_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
